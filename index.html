<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardar GPS - App Profesional</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(45deg, #2196F3, #21CBF3);
            --primary-color: #2196F3;
            --text-color: #333;
            --bg-color: #f5f7fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: var(--text-color);
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        h1 { color: #333; margin-bottom: 1.5rem; font-size: 1.8rem; }

        /* Botón Central Grande */
        .btn-central {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-central:active { transform: scale(0.95); }
        .btn-central:hover { box-shadow: 0 8px 20px rgba(33, 150, 243, 0.6); }

        .acciones {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-secundario {
            background: #fff;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-secundario:hover {
            background: #e3f2fd;
        }

        .estado {
            margin: 15px 0;
            min-height: 24px;
            color: #666;
            font-weight: 500;
        }

        /* Lista de Posiciones */
        #lista-posiciones {
            margin-top: 20px;
            text-align: left;
        }

        .item-posicion {
            background: #f9f9f9;
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid var(--primary-color);
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .item-num {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .item-lugar {
            font-weight: 600;
            font-size: 1rem;
        }

        .item-detalles {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 5px;
        }

        .item-nota {
            font-style: italic;
            color: #444;
            background: #fff;
            padding: 5px 8px;
            border-radius: 4px;
            border: 1px dashed #ccc;
            margin-top: 5px;
            display: block;
        }

        .item-nota:empty::before {
            content: "Sin notas";
            color: #aaa;
        }

        /* Botones de acción pequeños (Editar/Borrar) */
        .btn-icono {
            border: none;
            background: var(--primary-gradient); /* MISMO COLOR QUE EL BOTÓN GRANDE */
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            box-shadow: 0 2px 5px rgba(33, 150, 243, 0.3);
            transition: transform 0.2s;
            margin-left: 5px;
        }

        .btn-icono:hover { transform: scale(1.1); }
        .btn-icono:active { transform: scale(0.9); }

        .btn-borrar {
            //background: linear-gradient(45deg, #ff5252, #ff1744);
            box-shadow: 0 2px 5px rgba(255, 82, 82, 0.3);
        }

        /* Modal de Edición */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .modal h3 { margin-top: 0; color: var(--primary-color); }

        .nota-input {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .nota-input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .dictado-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        .btn-dictar {
            background: #eee;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            color: #555;
        }

        .btn-dictar.activo {
            background: #ffeb3b;
            color: #333;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 235, 59, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 235, 59, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 235, 59, 0); }
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .oculto { display: none; }
        
        a.map-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.8rem;
        }
        a.map-link:hover { text-decoration: underline; }

    </style>
</head>
<body>

    <div class="container">
        <h1>📍 Registro GPS</h1>
        
        <!-- Botón Central -->
        <button id="btn-guardar" class="btn-central">
            GUARDAR GPS
        </button>

        <div id="estado" class="estado"></div>

        <div class="acciones">
            <button id="btn-ver" class="btn-secundario">Ver Historial</button>
            <button id="btn-exportar" class="btn-secundario">Exportar CSV</button>
        </div>

        <div id="lista-posiciones" class="oculto">
            <h3 style="border-bottom: 1px solid #eee; padding-bottom: 10px;">Historial de Ubicaciones</h3>
            <div id="lista-contenido"></div>
        </div>
    </div>

    <!-- Modal para Editar Nota -->
    <div id="modal-edicion" class="modal-overlay">
        <div class="modal">
            <h3>Editar Nota</h3>
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 10px;">Escribe o dicta una nota para esta ubicación:</p>
            
            <textarea id="input-nota" class="nota-input" placeholder="Ej: Aquí hay un buen punto de vista..."></textarea>
            
            <div class="dictado-controls">
                <button id="btn-dictar" class="btn-dictar">
                    🎤 Dictar
                </button>
                <span id="estado-dictado" style="font-size: 0.8rem; color: #666;"></span>
            </div>

            <div class="modal-actions">
                <button id="btn-cancelar" class="btn-secundario" style="border-color: #ccc; color: #666;">Cancelar</button>
                <button id="btn-guardar-nota" class="btn-secundario" style="background: var(--primary-color); color: white; border: none;">Guardar Nota</button>
            </div>
        </div>
    </div>

    <script>
        // --- VARIABLES GLOBALES ---
        const btnGuardar = document.getElementById('btn-guardar');
        const btnVer = document.getElementById('btn-ver');
        const btnExportar = document.getElementById('btn-exportar');
        const estadoDiv = document.getElementById('estado');
        const listaDiv = document.getElementById('lista-posiciones');
        const listaContenido = document.getElementById('lista-contenido');
        
        // Modal variables
        const modal = document.getElementById('modal-edicion');
        const inputNota = document.getElementById('input-nota');
        const btnDictar = document.getElementById('btn-dictar');
        const estadoDictado = document.getElementById('estado-dictado');
        const btnGuardarNota = document.getElementById('btn-guardar-nota');
        const btnCancelar = document.getElementById('btn-cancelar');

        let posiciones = [];
        let indiceEdicionActual = -1;
        let recognition = null;

        // --- INICIALIZACIÓN ---
        window.onload = () => {
            const guardado = localStorage.getItem('gps_data_v2');
            if (guardado) posiciones = JSON.parse(guardado);
            
            // Configurar reconocimiento de voz si está disponible
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'es-ES';
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onstart = () => {
                    btnDictar.classList.add('activo');
                    btnDictar.innerHTML = "⏹ Detener";
                    estadoDictado.textContent = "Escuchando...";
                };

                recognition.onend = () => {
                    btnDictar.classList.remove('activo');
                    btnDictar.innerHTML = "🎤 Dictar";
                    estadoDictado.textContent = "";
                };

                recognition.onresult = (event) => {
                    const texto = event.results[0][0].transcript;
                    inputNota.value += (inputNota.value ? " " : "") + texto;
                };

                recognition.onerror = (event) => {
                    estadoDictado.textContent = "Error al escuchar.";
                    btnDictar.classList.remove('activo');
                };
            } else {
                btnDictar.style.display = 'none';
                estadoDictado.textContent = "Tu navegador no soporta dictado.";
            }
        };

        // --- FUNCIONALIDAD PRINCIPAL: GUARDAR GPS ---
        btnGuardar.addEventListener('click', async () => {
            estadoDiv.textContent = "🛰️ Obteniendo señal GPS de alta precisión...";
            estadoDiv.style.color = "#2196F3";

            if (!navigator.geolocation) {
                estadoDiv.textContent = "❌ Tu navegador no soporta GPS.";
                return;
            }

            try {
                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 0
                    });
                });

                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const alt = position.coords.altitude || 0;
                const googleMapsLink = `https://www.google.com/maps?q=${lat},${lon}`;

                estadoDiv.textContent = "🌍 Obteniendo dirección (Geocodificación)...";

                // Geocodificación Inversa (OpenStreetMap)
                const geoData = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
                    .then(res => res.json());

                const address = geoData.address || {};
                const pais = address.country || "Desconocido";
                const provincia = address.state || address.region || address.province || "Desconocido";
                const lugar = address.city || address.town || address.village || address.hamlet || address.suburb || "Zona Rural";

                const nuevoRegistro = {
                    num: posiciones.length + 1,
                    gps: `${lat.toFixed(6)}, ${lon.toFixed(6)}`,
                    latRaw: lat,
                    lonRaw: lon,
                    pais: pais,
                    provincia: provincia,
                    lugar: lugar,
                    elevacion: alt.toFixed(1),
                    nota: "",
                    mapa: googleMapsLink,
                    fecha: new Date().toLocaleString()
                };

                posiciones.unshift(nuevoRegistro);
                localStorage.setItem('gps_data_v2', JSON.stringify(posiciones));

                estadoDiv.textContent = "✅ ¡Posición Guardada con Éxito!";
                estadoDiv.style.color = "green";
                
                // Si la lista está visible, actualizarla
                if (!listaDiv.classList.contains('oculto')) {
                    renderizarLista();
                }

                setTimeout(() => { estadoDiv.textContent = ""; }, 4000);

            } catch (error) {
                console.error(error);
                let msg = "❌ Error: ";
                if (error.code === 1) msg += "Permiso de ubicación denegado.";
                else if (error.code === 2) msg += "Posición no disponible.";
                else if (error.code === 3) msg += "Tiempo de espera agotado.";
                else msg += error.message;
                
                estadoDiv.textContent = msg;
                estadoDiv.style.color = "red";
            }
        });

        // --- VER HISTORIAL ---
        btnVer.addEventListener('click', () => {
            listaDiv.classList.toggle('oculto');
            if (!listaDiv.classList.contains('oculto')) {
                renderizarLista();
                btnVer.textContent = "Ocultar Historial";
            } else {
                btnVer.textContent = "Ver Historial";
            }
        });

        function renderizarLista() {
            listaContenido.innerHTML = '';
            if (posiciones.length === 0) {
                listaContenido.innerHTML = '<p style="text-align:center; color:#999;">No hay registros guardados.</p>';
                return;
            }

            posiciones.forEach((p, index) => {
                const div = document.createElement('div');
                div.className = 'item-posicion';
                
                // Invertir índice para mostrar el más reciente arriba visualmente pero mantener lógica
                // El índice real en el array es (posiciones.length - 1 - index) si usamos unshift, 
                // pero aquí iteramos directamente sobre el array ya ordenado (unshift pone el nuevo al principio [0])
                
                div.innerHTML = `
                    <div class="item-header">
                        <span class="item-num">#${p.num}</span>
                        <div>
                            <button class="btn-icono" onclick="abrirEditor(${index})" title="Editar Nota">✏️</button>
                            <button class="btn-icono btn-borrar" onclick="borrarPosicion(${index})" title="Borrar">🗑️</button>
                        </div>
                    </div>
                    <div class="item-lugar">${p.lugar}, ${p.provincia}</div>
                    <div class="item-detalles">
                        📍 <a href="${p.mapa}" target="_blank" class="map-link">${p.gps}</a><br>
                        ⛰️ ${p.elevacion} msnm | 📅 ${p.fecha.split(',')[0]}
                    </div>
                    <div class="item-nota" id="nota-display-${index}">${p.nota}</div>
                `;
                listaContenido.appendChild(div);
            });
        }

        // --- EDITAR NOTA (CON DICTADO) ---
        window.abrirEditor = (index) => {
            indiceEdicionActual = index;
            inputNota.value = posiciones[index].nota || "";
            modal.style.display = 'flex';
            inputNota.focus();
        };

        btnCancelar.addEventListener('click', () => {
            modal.style.display = 'none';
            if (recognition && recognition.started) recognition.stop();
        });

        btnDictar.addEventListener('click', () => {
            if (!recognition) {
                alert("El dictado por voz no es compatible con este navegador.");
                return;
            }
            if (btnDictar.classList.contains('activo')) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        btnGuardarNota.addEventListener('click', () => {
            if (indiceEdicionActual !== -1) {
                posiciones[indiceEdicionActual].nota = inputNota.value.trim();
                localStorage.setItem('gps_data_v2', JSON.stringify(posiciones));
                renderizarLista(); // Refrescar la vista
                modal.style.display = 'none';
                if (recognition && recognition.started) recognition.stop();
            }
        });

        // Cerrar modal si clic fuera
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                btnCancelar.click();
            }
        });

        // --- BORRAR POSICIÓN ---
        window.borrarPosicion = (index) => {
            if(confirm('¿Estás seguro de borrar esta posición?')) {
                posiciones.splice(index, 1);
                // Renumerar
                posiciones.forEach((p, i) => p.num = i + 1);
                localStorage.setItem('gps_data_v2', JSON.stringify(posiciones));
                renderizarLista();
            }
        };

        // --- EXPORTAR CSV ---
        btnExportar.addEventListener('click', () => {
            if (posiciones.length === 0) {
                alert("No hay datos para exportar");
                return;
            }

            // BOM para Excel UTF-8
            const BOM = "\uFEFF"; 
            
            // Encabezados solicitados + Enlace
            // Num_posición; Pos. GPS; Pais; Provincia ;Lugar; Elevación; nota; Enlace Mapa
            let csvContent = BOM + "Num_posición;Pos. GPS;Pais;Provincia;Lugar;Elevación;nota;Enlace Mapa\n";

            posiciones.forEach(p => {
                // Escapar comillas dobles en textos
                const escape = (txt) => `"${(txt || '').toString().replace(/"/g, '""')}"`;
                
                const row = [
                    p.num,
                    escape(p.gps),
                    escape(p.pais),
                    escape(p.provincia),
                    escape(p.lugar),
                    escape(p.elevacion + " m"),
                    escape(p.nota),
                    escape(p.mapa)
                ].join(";");
                
                csvContent += row + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "registro_gps_completo.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
